<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Timeline | Indulge</title>
    <link rel="icon" type="image/svg+xml" href="https://indulge.digital/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Indulge brand tokens, taken from indulge.digital */
        :root {
            --clr-stratos: #00103d;
            --clr-biscay: #183159;
            --clr-hoki: #637a9f;
            --clr-emperor: #555555;
            --clr-geyser: #dbe3e8;
            --clr-white-lilac: #eef2f9;
            --clr-scooter: #27b4d2;
            --clr-brilliant-rose: #F8659F;
            --clr-ecstasy: #f57e21;
            --font-heading: "Montserrat", sans-serif;
            --font-body: "Raleway", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--clr-stratos);
            background: #ffffff;
            padding: 20px;
        }

        .page-wrapper {
            padding: 20px 0;
        }

        /* Chart styles */
        .chart-container {
            position: relative;
            width: 100%;
            height: 400px;
            margin-bottom: 60px;
        }

        .chart-area {
            position: absolute;
            left: 1.5%;
            right: 1.5%;
            top: 30px;
            bottom: 30px;
            border-left: 1px solid var(--clr-geyser);
            border-bottom: 1px solid var(--clr-geyser);
        }

        .chart-title {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }

        .y-axis-label {
            position: absolute;
            font-size: 11px;
            color: var(--clr-hoki);
            left: 0;
            transform: translateX(-100%) translateX(-5px);
        }

        .y-grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed var(--clr-white-lilac);
        }

        .chart-legend {
            position: absolute;
            top: 5px;
            right: 50px;
            display: flex;
            gap: 20px;
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 20px;
            height: 3px;
        }

        .legend-dashed {
            background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 5px 8px);
        }

        .data-point {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .data-point:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--clr-stratos);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
        }

        .chart-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Timeline styles */
        .timeline-container {
            position: relative;
            width: 100%;
            height: 320px;
            margin: 0 auto;
        }

        .timeline-line {
            position: absolute;
            top: 100px;
            left: 1.5%;
            right: 1.5%;
            height: 2px;
            background: var(--clr-stratos);
        }

        .quarter {
            position: absolute;
            top: 0;
            height: 100%;
        }

        .quarter-line {
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 20px;
            border-left: 1px dashed var(--clr-geyser);
        }

        .quarter-label {
            position: absolute;
            top: 115px;
            left: 0;
            transform: translateX(-50%);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 13px;
            color: var(--clr-stratos);
            white-space: nowrap;
        }

        .marker {
            position: absolute;
            top: 100px;
        }

        .marker-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--clr-scooter);
            border-radius: 50%;
            left: -4px;
            top: -3px;
            z-index: 10;
        }

        .marker-stem {
            position: absolute;
            width: 1px;
            background: var(--clr-stratos);
            left: 0;
        }

        .marker-stem.above {
            bottom: 5px;
        }

        .marker-stem.below {
            top: 5px;
        }

        .marker-label {
            position: absolute;
            font-size: 12px;
            color: var(--clr-stratos);
            white-space: nowrap;
            transform: rotate(-45deg);
            transform-origin: bottom left;
        }

        .marker-label.above {
            left: 2px;
        }

        .marker-label.below {
            left: 2px;
            transform: rotate(45deg);
            transform-origin: top left;
        }

        .marker-comment strong {
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--clr-stratos);
        }

        .marker-comment {
            position: absolute;
            font-size: 13px;
            color: var(--clr-emperor);
            width: 130px;
            line-height: 1.3;
            text-align: left;
            top: 200px;
            left: 0;
            transform: translateX(-50%);
        }

        /* Footer styles */
        .footer {
            background: var(--clr-stratos);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        body {
            padding-bottom: 70px;
        }

        .footer-logo {
            height: 24px;
        }

        .footer-left {
            color: white;
            font-size: 13px;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .footer-left span {
            opacity: 0.9;
        }

        .footer-right {
            color: white;
            font-size: 13px;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .footer-right span {
            opacity: 0.9;
        }

        .footer-link {
            color: white;
            opacity: 0.9;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="chart-container" id="chart">
                        <div class="chart-legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #27b4d2;"></div>
                    <span>MMLU (%)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #183159;"></div>
                    <span>GPQA Diamond (%)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-dashed" style="color: #f57e21;"></div>
                    <span>HLE (%, right axis)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-dashed" style="color: #F8659F;"></div>
                    <span>FrontierCode (%, right axis)</span>
                </div>
            </div>
            <div class="chart-area" id="chartArea"></div>
        </div>
        <div class="timeline-container" id="timeline">
            <div class="timeline-line"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-left">
            <a href="https://indulge.digital" target="_blank">
                <img src="https://indulge.digital/img/logo-white.svg" alt="Indulge" class="footer-logo">
            </a>
            <span><strong>AI Model Timeline</strong></span>
            <span id="lastUpdated"></span>
            <a href="models_benchmarks.csv" class="footer-link" download>Download Raw Data</a>
            <a href="https://github.com/patthewebrat/model-releases-timeline" class="footer-link" target="_blank">View on GitHub</a>
        </div>
        <div class="footer-right">
            <span>Built by Indulge</span>
            <span id="copyright"></span>
        </div>
    </footer>

    <script>
        // Benchmarks to plot. Saturated benchmarks share the left axis;
        // frontier benchmarks, where top models still score low, share the right.
        const SERIES = [
            { key: 'mmlu', column: 'MMLU', label: 'MMLU', color: '#27b4d2', axis: 'left' },
            { key: 'gpqa', column: 'GPQA', label: 'GPQA Diamond', color: '#183159', axis: 'left' },
            { key: 'hle', column: 'HLE', label: 'HLE', color: '#f57e21', axis: 'right' },
            { key: 'frontiercode', column: 'FrontierCode', label: 'FrontierCode', color: '#F8659F', axis: 'right' }
        ];

        // Parse CSV and build timeline
        async function loadTimeline() {
            const response = await fetch('models_benchmarks.csv');
            const csvText = await response.text();
            const lines = csvText.trim().split('\n');

            // Find column indices
            const headerRow = parseCSVLine(lines[0]);
            const modelIdx = headerRow.indexOf('Model');
            const orgIdx = headerRow.indexOf('Organisation');
            const dateIdx = headerRow.indexOf('Date');
            const scoreIdx = Object.fromEntries(
                SERIES.map(s => [s.key, headerRow.indexOf(s.column)])
            );
            const commentsIdx = headerRow.indexOf('Comments');

            // Parse data rows
            const models = [];
            for (let i = 1; i < lines.length; i++) {
                const row = parseCSVLine(lines[i]);
                if (row.length > dateIdx) {
                    const dateStr = row[dateIdx];
                    if (dateStr && dateStr.match(/\d+\/\d+\/\d+/)) {
                        const comment = commentsIdx >= 0 && row.length > commentsIdx ? row[commentsIdx] : '';
                        const model = {
                            model: row[modelIdx],
                            org: row[orgIdx],
                            date: dateStr,
                            comment: comment
                        };
                        SERIES.forEach(s => {
                            model[s.key] = scoreIdx[s.key] >= 0 ? parsePercentage(row[scoreIdx[s.key]]) : null;
                        });
                        models.push(model);
                    }
                }
            }

            // Sort by date
            models.sort((a, b) => parseDate(a.date) - parseDate(b.date));

            // Calculate date range for quarters
            const dates = models.map(m => parseDate(m.date));
            const minDate = new Date(Math.min(...dates));
            const maxDate = new Date(Math.max(...dates));

            // Generate quarters from min to max
            const quarters = generateQuarters(minDate, maxDate);

            // Render chart and timeline
            renderChart(quarters, models);
            renderTimeline(quarters, models);

            // Set last updated date to today
            const latestDate = new Date();
            document.getElementById('lastUpdated').textContent = `Last updated: ${latestDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parsePercentage(str) {
            if (!str) return null;
            const match = str.match(/~?(\d+\.?\d*)/);
            if (match) {
                return parseFloat(match[1]);
            }
            return null;
        }

        function parseDate(dateStr) {
            const parts = dateStr.split('/');
            const month = parseInt(parts[0]);
            const day = parseInt(parts[1]);
            let year = parseInt(parts[2]);
            if (year < 100) year += 2000;
            return new Date(year, month - 1, day);
        }

        function getQuarter(date) {
            const month = date.getMonth();
            const quarter = Math.floor(month / 3) + 1;
            return { q: quarter, year: date.getFullYear() };
        }

        function generateQuarters(minDate, maxDate) {
            const quarters = [];
            let current = new Date(minDate);
            current.setDate(1);
            current.setMonth(Math.floor(current.getMonth() / 3) * 3);

            while (current <= maxDate) {
                const q = getQuarter(current);
                quarters.push({
                    label: `Q${q.q} ${q.year}`,
                    year: q.year,
                    quarter: q.q,
                    startDate: new Date(current)
                });
                current.setMonth(current.getMonth() + 3);
            }

            // Add one more quarter at the end for spacing
            const q = getQuarter(current);
            quarters.push({
                label: `Q${q.q} ${q.year}`,
                year: q.year,
                quarter: q.q,
                startDate: new Date(current)
            });

            return quarters;
        }

        function getPositionInTimeline(date, quarters) {
            const totalQuarters = quarters.length;

            for (let i = 0; i < quarters.length - 1; i++) {
                const qStart = quarters[i].startDate;
                const qEnd = quarters[i + 1].startDate;

                if (date >= qStart && date < qEnd) {
                    const quarterDuration = qEnd - qStart;
                    const posInQuarter = (date - qStart) / quarterDuration;
                    const quarterWidth = 97 / totalQuarters;
                    const basePos = 1.9 + (i * quarterWidth);
                    return basePos + (posInQuarter * quarterWidth);
                }
            }

            const lastIdx = quarters.length - 1;
            const quarterWidth = 97 / totalQuarters;
            return 1.9 + (lastIdx * quarterWidth);
        }

        function renderChart(quarters, models) {
            const chartArea = document.getElementById('chartArea');
            const totalQuarters = quarters.length;
            const quarterWidth = 97 / totalQuarters;

            // Y-axis range - dynamically calculate from data
            const axisValues = axis => models.flatMap(m =>
                SERIES.filter(s => s.axis === axis).map(s => m[s.key])
            ).filter(v => v !== null);

            const axes = {
                left: { min: Math.floor(Math.min(...axisValues('left')) / 10) * 10, max: 100 }, // Round down to nearest 10
                right: { min: 0, max: Math.ceil(Math.max(...axisValues('right')) / 10) * 10 } // Round up to nearest 10
            };
            const toY = (value, axis) => 100 - ((value - axes[axis].min) / (axes[axis].max - axes[axis].min)) * 100;

            // Add Y-axis labels and grid lines (grid follows the left axis)
            ['left', 'right'].forEach(axis => {
                for (let v = axes[axis].min; v <= axes[axis].max; v += 10) {
                    const yPercent = toY(v, axis);

                    const label = document.createElement('div');
                    label.className = 'y-axis-label';
                    label.style.bottom = `${100 - yPercent}%`;
                    label.style.color = 'var(--clr-hoki)';
                    if (axis === 'right') {
                        label.style.right = '0';
                        label.style.left = 'auto';
                        label.style.transform = 'translateX(100%) translateX(5px)';
                    }
                    label.textContent = `${v}%`;
                    chartArea.appendChild(label);

                    if (axis === 'left') {
                        const gridLine = document.createElement('div');
                        gridLine.className = 'y-grid-line';
                        gridLine.style.bottom = `${100 - yPercent}%`;
                        chartArea.appendChild(gridLine);
                    }
                }
            });

            // Collect data points for lines
            const points = Object.fromEntries(SERIES.map(s => [s.key, []]));

            models.forEach((model) => {
                const date = parseDate(model.date);
                const xPos = getPositionInTimeline(date, quarters);
                // Convert from page percentage to chart area percentage
                const chartXPercent = ((xPos - 1.5) / 97) * 100;

                SERIES.forEach(s => {
                    if (model[s.key] === null) return;
                    const yPercent = toY(model[s.key], s.axis);
                    points[s.key].push({ x: chartXPercent, y: yPercent, model: model });

                    const point = document.createElement('div');
                    point.className = 'data-point';
                    point.style.left = `${chartXPercent}%`;
                    point.style.top = `${yPercent}%`;
                    point.style.background = s.color;
                    point.setAttribute('data-tooltip', `${model.model}: ${model[s.key]}% ${s.label}`);
                    chartArea.appendChild(point);
                });
            });

            // Draw lines using SVG. Right-axis series are dashed.
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'chart-line');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('preserveAspectRatio', 'none');

            SERIES.forEach(s => {
                if (points[s.key].length < 2) return;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                path.setAttribute('points', points[s.key].map(p => `${p.x},${p.y}`).join(' '));
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', s.color);
                path.setAttribute('stroke-width', '1.5');
                if (s.axis === 'right') path.setAttribute('stroke-dasharray', '6 4');
                path.setAttribute('vector-effect', 'non-scaling-stroke');
                svg.appendChild(path);
            });

            chartArea.appendChild(svg);
        }

        function renderTimeline(quarters, models) {
            const container = document.getElementById('timeline');
            const totalQuarters = quarters.length;
            const quarterWidth = 97 / totalQuarters;

            // Render quarter markers
            quarters.forEach((q, i) => {
                const pos = 1.9 + (i * quarterWidth);
                const quarterDiv = document.createElement('div');
                quarterDiv.className = 'quarter';
                quarterDiv.style.left = `${pos}%`;
                quarterDiv.innerHTML = `
                    <div class="quarter-line"></div>
                    <div class="quarter-label">${q.label}</div>
                `;
                container.appendChild(quarterDiv);
            });

            // Comments are placed after render, once their real heights are known.
            const comments = [];

            // Place labels so they don't overlap. Labels sit at 45deg, so each one
            // lies on a diagonal line. Two labels on the same side are clear of each
            // other when their diagonals are far enough apart. Work right to left,
            // giving each marker the side and the shortest stem that clears the
            // labels already placed to its right.
            const MIN_STEM = 30;
            const DIAGONAL_GAP = 26; // ~18px perpendicular clearance at 45deg
            const LOOKAHEAD_PX = 300;
            const containerWidth = container.offsetWidth;
            const placements = new Array(models.length);
            let prevSide = 'below';

            for (let i = models.length - 1; i >= 0; i--) {
                const x = getPositionInTimeline(parseDate(models[i].date), quarters) / 100 * containerWidth;
                const stemFor = side => {
                    let stem = MIN_STEM;
                    for (let j = i + 1; j < models.length; j++) {
                        const p = placements[j];
                        if (p.x - x > LOOKAHEAD_PX) break;
                        if (p.side === side) stem = Math.max(stem, p.stem - (p.x - x) + DIAGONAL_GAP);
                    }
                    return stem;
                };
                const above = stemFor('above');
                const below = stemFor('below');
                // Prefer the shorter stem; on a tie, alternate sides.
                const side = above < below ? 'above'
                    : below < above ? 'below'
                    : (prevSide === 'above' ? 'below' : 'above');
                placements[i] = { x, side, stem: side === 'above' ? above : below };
                prevSide = side;
            }

            // Render model markers
            models.forEach((model, idx) => {
                const date = parseDate(model.date);
                const pos = getPositionInTimeline(date, quarters);

                const isAbove = placements[idx].side === 'above';
                const stemHeight = placements[idx].stem;

                const marker = document.createElement('div');
                marker.className = 'marker';
                marker.style.left = `${pos}%`;

                const label = `${model.org} / ${model.model}`;

                let html = `
                    <div class="marker-dot"></div>
                    <div class="marker-stem ${isAbove ? 'above' : 'below'}" style="height: ${stemHeight}px;"></div>
                    <div class="marker-label ${isAbove ? 'above' : 'below'}" style="${isAbove ? 'bottom' : 'top'}: ${stemHeight + 8}px;">${label}</div>
                `;

                if (model.comment) {
                    html += `<div class="marker-comment"><strong>${model.model}</strong><br>${model.comment}</div>`;
                }

                marker.innerHTML = html;
                container.appendChild(marker);

                const commentEl = marker.querySelector('.marker-comment');
                if (commentEl) comments.push({ el: commentEl, x: pos / 100 * containerWidth });
            });

            // Measure after web fonts load, or heights come out short.
            document.fonts.ready.then(() => placeComments(container, comments));
        }

        // Stack comment boxes without overlap. Each box goes in the highest free
        // slot. It may slide sideways (up to MAX_SHIFT) if that lets it sit higher,
        // so crowded periods spread into empty space nearby.
        function placeComments(container, comments) {
            const BASE_TOP = 200;
            const GAP = 12;
            const MAX_SHIFT = 200;
            const SHIFT_STEP = 20;
            const containerWidth = container.offsetWidth;
            const placed = [];

            const topAt = (x, width, height) => {
                const neighbours = placed.filter(p => Math.abs(p.x - x) < (width + p.width) / 2 + GAP);
                const fits = top => neighbours.every(p => top + height + GAP <= p.top || top >= p.top + p.height + GAP);
                return [BASE_TOP, ...neighbours.map(p => p.top + p.height + GAP)]
                    .sort((a, b) => a - b)
                    .find(fits);
            };

            comments.forEach(c => {
                const width = c.el.offsetWidth;
                const height = c.el.offsetHeight;
                let best = null;
                for (let shift = -MAX_SHIFT; shift <= MAX_SHIFT; shift += SHIFT_STEP) {
                    const x = c.x + shift;
                    if (x - width / 2 < 0 || x + width / 2 > containerWidth) continue;
                    const top = topAt(x, width, height);
                    // Prefer the highest slot; on a tie, the smallest shift.
                    if (!best || top < best.top || (top === best.top && Math.abs(shift) < Math.abs(best.shift))) {
                        best = { x, shift, top };
                    }
                }

                c.el.style.top = `${best.top}px`;
                c.el.style.left = `${best.shift}px`;
                placed.push({ x: best.x, width, height, top: best.top });
            });

            // Grow the timeline so the lowest comment clears the fixed footer.
            const bottom = Math.max(0, ...placed.map(p => p.top + p.height));
            container.style.height = `${Math.max(320, bottom + 20)}px`;
        }

        // Load timeline on page load
        loadTimeline();

        // Set copyright year
        document.getElementById('copyright').textContent = `© ${new Date().getFullYear()} Indulge Digital`;

    </script>
</body>
</html>
